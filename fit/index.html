<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fitio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0D12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D12;--card:#141823;--card2:#1B2030;--line:#272D3F;--t:#F5F7FA;--m:#9AA3B2;--v:#7C5CFF;--c:#22D3EE;--ok:#34D399;--warn:#FBBF24;--bad:#F87171;--g:linear-gradient(135deg,#7C5CFF,#22D3EE)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip}
body{background:radial-gradient(ellipse at 10% -10%,rgba(124,92,255,.18),transparent 50%),radial-gradient(ellipse at 100% 0%,rgba(34,211,238,.12),transparent 45%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand svg{width:30px;height:30px;flex:none}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.ib svg{width:19px;height:19px}
.dnav{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:10px auto 0;gap:8px}
.dnav .lbl{flex:1;text-align:center;font-weight:700;font-size:15px}
.dnav .lbl small{display:block;color:var(--m);font-weight:500;font-size:12px}
.today{font-size:12px;font-weight:700;color:var(--c);padding:4px 10px;border:1px solid rgba(34,211,238,.4);border-radius:99px;margin-left:6px;vertical-align:middle}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(150px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,16,23,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:11.5px;font-weight:600;color:var(--m);border-radius:12px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--t)}
nav button.on svg{stroke:url(#gr)}
h2{font-size:21px;letter-spacing:-.4px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:15px;margin:18px 0 8px;color:var(--m);font-weight:600;text-transform:uppercase;letter-spacing:1.2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.muted{color:var(--m)}.small{font-size:13px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pchips{position:sticky;top:var(--hh, 120px);z-index:15;background:rgba(11,13,18,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:8px;padding-bottom:8px;margin-top:-4px;border-bottom:1px solid var(--line)}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--m);white-space:nowrap}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.wtitle{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:8px 0 4px}
.wtitle b{font-size:30px;letter-spacing:-1px;line-height:1}
.pill{font-size:12px;font-weight:600;color:var(--m);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.45)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 13px 10px;margin-bottom:10px}
.ex.core{background:#17152A;border-color:#2C2752}
.ex.alldone{border-color:rgba(52,211,153,.45)}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exh b{font-size:16px;line-height:1.3}
.exh small{display:block;color:var(--m);font-size:12.5px;margin-top:2px}
.exr{display:flex;gap:6px;align-items:flex-start;flex:none}.exr .tgi{flex:none;max-width:none}.exh>div:first-child{flex:1}
.animbox{background:radial-gradient(circle at 50% 40%,rgba(124,92,255,.14),transparent 70%),var(--card2);border:1px solid var(--line);border-radius:16px;margin:0 auto 12px;aspect-ratio:240/230;max-height:230px;display:flex;justify-content:center}.animbox svg{height:100%;width:auto;max-width:100%}
.infob{font-size:15px;color:var(--m)}
.gq{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}.gq .chip{cursor:pointer}
.gsum{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px;color:var(--m);line-height:1.6}
.gper{margin-bottom:12px}.gper summary{cursor:pointer;color:var(--m);font-size:13.5px;font-weight:600}
.howl,.howp{margin:0 0 6px;padding-left:20px;line-height:1.55}.howl li,.howp li{margin-bottom:6px}.howp li::marker{color:var(--warn)}
.colb{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--t);font-size:19px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
.ex.min{padding-bottom:12px}.ex.min .fx,.ex.min .setrow,.ex.min .tgi{display:none}
.okc{color:#34D399;font-weight:700}
.tg{flex:none;font-weight:700;font-size:14px;color:#B9A8FF;background:rgba(124,92,255,.14);border-radius:9px;padding:4px 8px;white-space:nowrap}
.tgi{flex:none;border:1px solid rgba(124,92,255,.35);font:inherit;font-weight:700;font-size:14px;text-align:center;outline:none;width:auto;max-width:48%}
.tgi:focus{border-color:var(--v);background:rgba(124,92,255,.25)}
.meta{font-size:12.5px;color:var(--m);margin:7px 0 8px;line-height:1.45}
.meta .up{color:var(--ok);font-weight:600}
.set{display:grid;grid-template-columns:22px 1fr auto 1fr auto 44px;align-items:center;gap:6px;margin-top:6px}
.set.c{grid-template-columns:22px 1fr auto 44px}
.set .n{color:var(--m);font-size:13px;font-weight:700;text-align:center}
.set .u{color:var(--m);font-size:12.5px}
input.f{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 10px;font-size:16px;font-weight:600;text-align:center;outline:none}
select.f{-webkit-appearance:none;appearance:none;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px;font-size:16px;font-weight:600;text-align:center;text-align-last:center;outline:none}
input.fx{text-align:left;margin-top:6px;padding:12px}
input.f:focus{border-color:var(--v)}
input.f::placeholder{color:#5D6577;font-weight:500}
.okb{width:44px;height:42px;border-radius:11px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center}
.okb svg{width:20px;height:20px;stroke:#5D6577}
.setrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.dots{display:flex;gap:5px;flex:none}
.dots i{width:11px;height:11px;border-radius:99px;background:var(--card2);border:1px solid #3A4156}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.setrow .st{flex:1;font-size:14px;font-weight:600;color:var(--m)}
.setrow .st.fin{color:var(--ok)}
.setb{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:12px;background:var(--g);color:#fff;font-weight:700;font-size:14px;flex:none}
.setb svg{width:18px;height:18px;stroke:#fff}
.undo{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1px solid var(--line);color:var(--m);font-size:17px;flex:none}
.okb.on{background:var(--ok);border-color:var(--ok)}
.okb.on svg{stroke:#06281C}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;background:var(--g);color:#fff;font-weight:700;font-size:16px}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--t)}
.btn.ok{background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.5);color:var(--ok)}
.btn.sm{padding:10px;font-size:14px;width:auto}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.note{font-size:13.5px;line-height:1.5;color:#D6D0FF;background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.3);border-radius:14px;padding:11px 13px;margin:10px 0}
.bar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--g);transition:width .3s}
.bar.over i{background:var(--warn)}
.big{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macros div{font-size:13px}
.macros b{display:block;font-size:15px;margin-bottom:5px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .tx{flex:1;min-width:0}
.list .it .tx b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .tx small{color:var(--m);font-size:12.5px}
.x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--m);flex:none}
.x svg{width:17px;height:17px}
.add{width:38px;height:38px;border-radius:11px;background:var(--g);display:grid;place-items:center;flex:none}
.add svg{width:20px;height:20px;stroke:#fff}
.fld{display:block;margin-bottom:9px}
.dtype{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 10px}.dtype .chip{white-space:normal;text-align:center;line-height:1.2;padding:9px 6px;margin:0;width:100%}
.fld span{display:block;font-size:12.5px;color:var(--m);margin-bottom:4px;font-weight:600}
.fld input,.fld select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;outline:none}
.fld input:focus{border-color:var(--v)}
.g4{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.vid{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:8px 0 10px}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.aim{position:absolute;left:10%;right:10%;top:34%;height:32%;border:3px solid #22D3EE;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.vid .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#fff;font-size:14px}
.res .g4 .fld input{padding:9px 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4 .fld span{font-size:11.5px}
.g4 .fld input{padding:10px 6px;text-align:center}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--m);margin:4px 0 12px}
.chk input{width:20px;height:20px;accent-color:var(--v)}
.supp{display:flex;align-items:center;gap:12px}
.tick{width:52px;height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card2);display:grid;place-items:center;flex:none}
.tick svg{width:26px;height:26px;stroke:#4A5163}
.tick.on{background:var(--g);border-color:transparent}
.tick.on svg{stroke:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.stats small{display:block;color:var(--m);font-size:12px;margin-bottom:4px}
.stats b{font-size:20px;letter-spacing:-.5px}
.chart svg{width:100%;height:auto;display:block}
.timer{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:25;max-width:616px;margin:0 auto;background:#1E1A38;border:1px solid #3C3478;border-radius:18px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.timer.show{display:flex}
.timer .tt{flex:1}
.timer .tt small{display:block;font-size:12px;color:#B9A8FF;font-weight:600}
.timer .tt b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.timer.end{background:#0F3A2B;border-color:var(--ok)}
.timer button{padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.08);font-weight:700;font-size:14px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,6,10,.7);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal{overscroll-behavior:contain}
body.lock{position:fixed;left:0;right:0;overflow:hidden}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h2{margin:0}
.empty{text-align:center;color:var(--m);padding:18px 6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;background:#1C2233;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.water{display:flex;align-items:center;gap:10px}
.water .wv{flex:1}
.water .wv b{font-size:18px}
.hist .it b{font-size:14.5px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs></svg>

<header>
  <div class="hrow">
    <div class="brand">
      <svg viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect width="56" height="56" rx="15" fill="url(#lg)"/><path d="M41.86 20A16 16 0 1 1 36 14.14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M16.5 29h5.5l2.6-6.5 4.6 12 3-7.5h7.3" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Fit<span class="grad">io</span></span>
    </div>
    <button class="ib" data-act="settings" aria-label="Nastavenia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="dnav">
    <button class="ib" data-act="day" data-d="-1" aria-label="Predchádzajúci deň"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="lbl" id="dlbl"></div>
    <button class="ib" data-act="day" data-d="1" aria-label="Nasledujúci deň"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</header>

<main id="main"></main>

<div class="timer" id="timer">
  <div class="tt"><small id="tlbl">Pauza</small><b id="tval">0:00</b></div>
  <button data-act="tadd" data-s="-15">−15</button>
  <button data-act="tadd" data-s="15">+15</button>
  <button data-act="tstop" aria-label="Zavrieť">✕</button>
</div>

<nav><div class="in">
  <button data-tab="trening"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Tréning</button>
  <button data-tab="strava"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5a2 2 0 0 0 2 2M11 3v5a2 2 0 0 1-2 2M17 21V3c-2 1.5-3 4-3 7 0 2 1 3 3 3"/></svg>Strava</button>
  <button data-tab="doplnky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="M9.5 9.5l5 5"/></svg>Doplnky</button>
  <button data-tab="pokrok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Pokrok</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Plán</button>
</div></nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- Plán ---------- */
const PLAN = {
  ua:{n:'Upper A',z:'hrudník, chrbát, ramená · sila',ex:[
    ['Bench press (tlak na lavičke)','lavička, tyč','4 × 5–8','2–3 min'],
    ['Zhyby nadhmatom','hrazda','4 × 5–8','2 min'],
    ['Tlak nad hlavu v stoji','tyč zo stojana','3 × 6–8','2 min'],
    ['Prítah tyče v predklone','tyč','3 × 8–10','90 s'],
    ['Dipy','bradlá','3 × 8–12','90 s'],
    ['Bicepsový zdvih s tyčou','tyč','3 × 10–12','60 s']],
   core:[['Plank','3 × 45–60 s','30 s'],['Prítahy kolien vo vise','3 × 10–15','45 s'],['Russian twist s kotúčom 5 kg','3 × 20','30 s']]},
  la:{n:'Lower A',z:'stehná, zadok · drep',ex:[
    ['Drep s tyčou','stojan, tyč','4 × 5–8','2–3 min'],

/* ---------- Synchronizácia (cez súkromný GitHub Gist) ---------- */
const GH = 'https://api.github.com', GFILE = 'zenkodmyfit.json';
let SY = {}; try { SY = JSON.parse(localStorage.getItem(KEY + '-gh')) || {}; } catch(e){}
function saveSY(){ try { localStorage.setItem(KEY + '-gh', JSON.stringify(SY)); } catch(e){} }
const ghH = () => ({'Authorization':'Bearer ' + SY.token, 'Accept':'application/vnd.github+json'});
let pushT = 0, dirty = false;
function schedulePush(){ if (!SY.gist) return; dirty = true; clearTimeout(pushT); pushT = setTimeout(pushNow, 2500); }
async function pushNow(){
  if (!SY.gist) return false;
  try {
    const r = await fetch(GH + '/gists/' + SY.gist, {method:'PATCH', headers:ghH(), body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(S)}}})});
    if (!r.ok) throw r.status; dirty = false; SY.last = Date.now(); SY.err = ''; saveSY(); return true;
  } catch(e){ SY.err = e === 401 ? 'Kľúč neplatí, vlož nový' : 'Bez pripojenia, skúsim neskôr'; saveSY(); return false; }
}
async function readGist(id){
  const r = await fetch(GH + '/gists/' + id + '?t=' + Date.now(), {headers:ghH(), cache:'no-store'}); if (!r.ok) throw r.status;
  const g = await r.json(); const f = g.files && g.files[GFILE]; if (!f) return null;
  const txt = f.truncated ? await (await fetch(f.raw_url, {cache:'no-store'})).text() : f.content;
  return JSON.parse(txt);
}
function applyRemote(d){ S = Object.assign(fresh(), d); S.goals = Object.assign(fresh().goals, S.goals || {}); save(true); rerender(); }
async function pullNow(force){
  if (!SY.gist) return false;
  try {
    const d = await readGist(SY.gist);
    if (d && d.goals && (force || (d.upd || 0) > (S.upd || 0))){ applyRemote(d); SY.last = Date.now(); SY.err = ''; saveSY(); return 'pulled'; }
    if (!d || (S.upd || 0) > (d.upd || 0)) await pushNow();
    SY.last = Date.now(); SY.err = ''; saveSY(); return true;
  } catch(e){ SY.err = e === 401 ? 'Kľúč neplatí, vlož nový' : 'Bez pripojenia, skúsim neskôr'; saveSY(); return false; }
}
async function connectGH(token){
  SY = {token}; 
  const r = await fetch(GH + '/gists?per_page=100', {headers:ghH(), cache:'no-store'});
  if (r.status === 401) throw 'Kľúč nie je správny';
  if (!r.ok) throw 'GitHub teraz neodpovedá, skús o chvíľu';
  const list = await r.json(); const g = list.find(x => x.files && x.files[GFILE]);
  if (g){
    SY.gist = g.id; saveSY();
    if (confirm('Na GitHube už máš uložené údaje z iného zariadenia. Načítať ich sem? (údaje na tomto zariadení sa nahradia)')) return (await pullNow(true)) ? 'pulled' : 'err';
    return (await pullNow(false)) ? 'pushed' : 'err';
  }
  const c = await fetch(GH + '/gists', {method:'POST', headers:ghH(), body:JSON.stringify({description:'Fitio – moje údaje (nemazať)', public:false, files:{[GFILE]:{content:JSON.stringify(S)}}})});
  if (!c.ok) throw (c.status === 403 || c.status === 404) ? 'Kľúč nemá povolenie „gist“' : 'Nepodarilo sa uložiť na GitHub';
  SY.gist = (await c.json()).id; SY.last = Date.now(); saveSY(); return 'created';
}

  <ol class="muted small" style="line-height:1.6;padding-left:18px;margin:0 0 10px">

  return `<p class="muted small" style="line-height:1.5;margin-top:0">Synchronizácia cez GitHub je zapnutá. Všetko, čo zapíšeš, sa samo uloží a druhé zariadenie si to načíta pri otvorení appky.</p>

let camStream = null, zx = null, detLoop = 0, scanning = false;
let lockY = 0;
function openModal(){ if (!$('#modal').classList.contains('show')){ lockY = window.scrollY; document.body.style.top = -lockY + 'px'; document.body.classList.add('lock'); } $('#modal').classList.add('show'); $('#sheet').scrollTop = 0; }

function loadScript(src){ return new Promise((ok, bad) => { if (document.querySelector('script[src="' + src + '"]')) return ok(); const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = bad; document.head.appendChild(el); }); }
function openScan(){
  $('#sheet').innerHTML = `<div class="top"><h2>Čiarový kód</h2><button class="x" data-act="close" aria-label="Zavrieť">${ICON.x}</button></div>
  <div class="vid"><video id="sv" playsinline muted autoplay></video><div class="aim"></div><div class="msg" id="smsg">Zapínam kameru…</div></div>
  <label class="btn sec" style="margin-bottom:10px;cursor:pointer">Odfotiť čiarový kód<input type="file" id="sphoto" accept="image/*" capture="environment" style="display:none"></label>
  <div class="row"><input class="f" style="flex:2;text-align:left" id="scode" inputmode="numeric" placeholder="alebo zadaj kód ručne"><button class="btn sm" style="flex:1" data-act="lookup">Hľadať</button></div>
  <div id="sres" class="res" style="margin-top:12px"></div>`;
  openModal();

const ZX_URLS = ['zxing.min.js','https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js','https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js','https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js'];
let zxReader = null, nativeDet = null;
async function getDecoder(){
  if (nativeDet || zxReader) return true;
  if ('BarcodeDetector' in window){ try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('ean_13')){ nativeDet = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); return true; } } catch(e){} }
  for (const u of ZX_URLS){ try { await loadScript(u); if (window.ZXing && ZXing.MultiFormatReader) break; } catch(e){} }
  if (!window.ZXing || !ZXing.MultiFormatReader) return false;
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  zxReader = new ZXing.MultiFormatReader(); zxReader.setHints(hints);
  return true;
}
const scanCv = document.createElement('canvas');
async function decodeSource(src, w, h, crop){
  // crop: vezmi stredný pás obrazu, kde býva čiarový kód
  const sx = 0, sy = crop ? Math.round(h * 0.25) : 0, sw = w, sh = crop ? Math.round(h * 0.5) : h;
  const scale = Math.min(1, 1280 / sw);
  scanCv.width = Math.round(sw * scale); scanCv.height = Math.round(sh * scale);
  const ctx = scanCv.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, scanCv.width, scanCv.height);
  if (nativeDet){ try { const r = await nativeDet.detect(scanCv); if (r && r.length) return r[0].rawValue; } catch(e){} return null; }
  try {
    const lum = new ZXing.HTMLCanvasElementLuminanceSource(scanCv);
    const res = zxReader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum)));
    return res && res.getText();
  } catch(e){ return null; }
}
async function startCam(){
  const v = $('#sv'), m = $('#smsg'); if (!v) return;
  scanning = true; if (m){ m.textContent = 'Zapínam kameru…'; m.style.display = ''; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    v.srcObject = camStream; await v.play();
    if (m){ m.textContent = 'Pripravujem skener…'; }
    if (!(await getDecoder())){ if (m) m.textContent = 'Skener sa nepodarilo načítať. Odfoť kód tlačidlom nižšie alebo ho zadaj ručne.'; return; }
    if (m) m.style.display = 'none';
    const loop = async () => {
      if (!scanning) return;
      if (v.videoWidth){ const t = await decodeSource(v, v.videoWidth, v.videoHeight, true); if (t && scanning){ onCode(t); return; } }
      detLoop = setTimeout(loop, 200);
    };
    loop();
  } catch(e){
    scanning = false;
    if (m){ m.style.display = ''; m.textContent = e && e.name === 'NotAllowedError' ? 'Kamera nie je povolená. Povoľ ju v nastaveniach, odfoť kód tlačidlom nižšie alebo ho zadaj ručne.' : 'Kameru sa nepodarilo zapnúť. Odfoť kód tlačidlom nižšie alebo ho zadaj ručne.'; }
  }
}
async function scanPhoto(file){
  const m = $('#smsg'); if (m){ m.style.display = ''; m.textContent = 'Hľadám kód na fotke…'; }
  if (!(await getDecoder())){ toast('Skener sa nepodarilo načítať, zadaj kód ručne'); return; }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    let t = await decodeSource(img, img.naturalWidth, img.naturalHeight, false) || await decodeSource(img, img.naturalWidth, img.naturalHeight, true);
    if (t){ onCode(t); } else { if (m) m.textContent = 'Na fotke som kód nenašiel. Skús ho odfotiť zblízka a rovno, alebo ho zadaj ručne.'; }
  } catch(e){ toast('Fotku sa nepodarilo načítať'); }
  URL.revokeObjectURL(url);
}
function stopCam(){
  scanning = false; clearTimeout(detLoop);
  const v = $('#sv'); const st = camStream || (v && v.srcObject);
  if (st) st.getTracks().forEach(t => t.stop()); camStream = null; if (v) v.srcObject = null;
}
let scanItem = null;
function onCode(code){ stopCam(); try { navigator.vibrate && navigator.vibrate(80); } catch(e){} $('#scode').value = code; lookup(code); }
async function lookup(code){
  const r = $('#sres'); r.innerHTML = '<div class="empty">Hľadám potravinu…</div>';
  const local = S.foods.find(f => f.code === code && f.per);
  if (local){ showScan({code, n:local.base || local.n, per:local.per, g:local.g || 100, known:true}); return; }
  try {
    const res = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=product_name,product_name_sk,product_name_cs,brands,nutriments,serving_quantity');
    const d = await res.json();
    const P = d && d.status === 1 && d.product;
    const nu = P && P.nutriments || {};
    let kcal = nu['energy-kcal_100g']; if (kcal == null && nu.energy_100g != null) kcal = nu.energy_100g / 4.184;
    if (!P || kcal == null){ showScan({code, n:(P && (P.product_name_sk || P.product_name_cs || P.product_name)) || '', per:{kcal:'',p:'',f:'',c:'',v:''}, g:100, missing:true}); return; }
    const nm = (P.product_name_sk || P.product_name_cs || P.product_name || 'Potravina') + (P.brands ? ' (' + P.brands.split(',')[0].trim() + ')' : '');
    const r1 = x => x == null || x === '' ? '' : Math.round(x * 10) / 10;
    showScan({code, n:nm, per:{kcal:Math.round(kcal), p:r1(nu.proteins_100g), f:r1(nu.fat_100g), c:r1(nu.carbohydrates_100g), v:r1(nu.fiber_100g)}, g:Math.round(num(P.serving_quantity)) || 100});
  } catch(e){
    showScan({code, n:'', per:{kcal:'',p:'',f:'',c:'',v:''}, g:100, missing:true, offline:true});
  }
}
function showScan(it){
  scanItem = it;

  const f = (id, l, v) => `<label class="fld"><span>${l}</span><input id="r_${id}" inputmode="decimal" value="${esc(v)}"></label>`;

   `<div class="card"><label class="fld"><span>Názov</span><input id="r_n" value="${esc(it.n)}" placeholder="napr. Tvaroh polotučný"></label>

   <label class="fld"><span>Koľko si zjedol (g)</span><input id="r_g" inputmode="decimal" value="${esc(it.g)}" style="font-size:20px;font-weight:700"></label>

function dayType(k){ const o = S.dayType && S.dayType[k]; if (o) return o; return workoutFor(k) ? 't' : 'r'; }

const WHEN = ['', 'pred výkonom', 'po výkone', 'pred aj po výkone', 'zvyšok dňa', 'ráno', 'večer', 'kedykoľvek'];
function whenOf(x, t){ const v = x[WK[t]]; return v === undefined ? (x.when || '') : v; }
const DTN = {t:'cvičenie / posilňovňu', f:'futbal / tréning', r:'voľný deň'};
function suppsFor(k){ const t = dayType(k); return S.supps.map(normSupp).filter(x => doseOf(x, t)).map((x, i) => [x, i]).sort((a, b) => { const r = y => { const w = whenOf(y, t), m = parseInt(timeOf(y, t)) || 0; return w === 'pred výkonom' ? -m : w === 'pred aj po výkone' ? 0 : w === 'po výkone' ? 1000 + m : 5000; }; return r(a[0]) - r(b[0]) || a[1] - b[1]; }).map(a => a[0]); }

function renderDoplnky(){

    return `<div class="card supp"><button class="tick ${on?'on':''}" data-act="supp" data-id="${x.id}" aria-label="Vzaté">${ICON.ok.replace('<svg ','<svg stroke="currentColor" ')}</button><div style="flex:1;min-width:0"><b style="font-size:17px">${esc(x.n)}</b> <span class="grad" style="font-weight:700">${esc(dose)}</span><div class="muted small" style="margin-top:3px">${esc(mt)}${st?`${mt?' · ':''}séria ${st} ${st===1?'deň':st<5?'dni':'dní'}`:''}</div>${x.note ? `<div class="small" style="margin-top:6px;padding:7px 10px;border-radius:9px;background:var(--card2);color:#C9CFDB;white-space:pre-wrap">${esc(x.note)}</div>` : ''}</div><button class="x" data-act="editsupp" data-id="${x.id}" aria-label="Upraviť"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>`; };
  const GR = [['ráno','Ráno'],['pred výkonom','Pred výkonom'],['pred aj po výkone','Pred aj po výkone'],['po výkone','Po výkone'],['zvyšok dňa','Zvyšok dňa'],['večer','Večer'],['kedykoľvek','Kedykoľvek'],['','Bez určeného času']];

    : `<div class="card empty">Na ${DTN[t]} nemáš žiadne doplnky.</div>`;
  const E = suppEdit ? S.supps.find(x => x.id === suppEdit) : null;

   <label class="fld"><span>Názov</span><input id="sn" placeholder="napr. Proteín" value="${esc(E ? E.n : '')}"></label>
   ${[['t','Cvičenie / Posilňovňa','napr. 5 g'],['f','Futbal / Tréning','napr. 5 g'],['r','Voľný deň','napr. 5 g']].filter(([k]) => k === t).map(([k,l,ph]) => { const w = E ? whenOf(E, k) : ''; const opts = WHEN.includes(w) ? WHEN : WHEN.concat([w]); return `<div style="font-weight:700;font-size:14px;margin:6px 0 4px">${l}</div><div class="g2"><label class="fld"><span>Množstvo</span><input id="sd_${k}" placeholder="${ph}" value="${esc(E ? doseOf(E, k) : '')}"></label><label class="fld"><span>Kedy</span><select id="sw_${k}">${opts.map(o => `<option value="${esc(o)}" ${o===w?'selected':''}>${o ? esc(o) : '—'}</option>`).join('')}</select></label></div><div class="g2"><label class="fld"><span>Koľko minút</span><input id="st_${k}" placeholder="napr. 30 alebo 45-60" value="${esc(E ? timeOf(E, k) : '')}"></label><div></div></div>`; }).join('')}
   <label class="fld"><span>Poznámka (nepovinné)</span><textarea id="snote" rows="2" placeholder="napr. zapiť veľkým pohárom vody" style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;outline:none;resize:vertical;font-family:inherit;color:inherit">${esc(E ? E.note || '' : '')}</textarea></label>

  const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(cur, -i));
  if (S.supps.length) h += '<h3>Posledných 7 dní</h3><div class="card">' + S.supps.map(x => `<div class="row" style="margin:6px 0"><span style="flex:1.2;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n)}</span>${days.map(d => { const need = doseOf(x, dayType(d)); const on = (S.suppLog[d]||[]).includes(x.id); return `<span style="flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;${on?'background:var(--g);color:#fff':need?'background:var(--card2);color:#9AA3B2':'background:transparent;color:#3A4156;border:1px dashed #272D3F'}">${parseKey(d).getDate()}</span>`; }).join('')}</div>`).join('') + '<p class="muted small" style="margin:8px 0 0">Prerušený rámik = v ten deň ho neberieš.</p></div>';

/* ---------- Pokrok ---------- */
function avgWeight(endK, days){
  const v = []; for (let i = 0; i < days; i++){ const w = S.weight[addDays(endK, -i)]; if (w) v.push(w); }
  return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null;
}
function renderPokrok(){
  const G = S.goals;
  const wNow = S.weight[cur];
  let h = `<h2>Ranná váha</h2><div class="card"><div class="row"><input class="f" id="wkg" inputmode="decimal" style="font-size:22px;flex:2" placeholder="${esc(Object.keys(S.weight).length ? fmt(S.weight[Object.keys(S.weight).sort().pop()],1) : fmt(G.start,1))}" value="${wNow?esc(fmt(wNow,1)):''}"><span class="muted" style="flex:none">kg</span><button class="btn sm" style="flex:1.3" data-act="saveweight">Uložiť</button></div><p class="muted small" style="margin:9px 0 0">Váž sa ráno nalačno, po záchode. Sleduj týždenný priemer, nie jednotlivé dni.</p></div>`;
  const a7 = avgWeight(cur, 7), a7p = avgWeight(addDays(cur, -7), 7), a14 = avgWeight(addDays(cur, -14), 7);
  const now = a7 || G.start;
  const prog = Math.max(0, Math.min(100, (now - G.start) / (G.target - G.start) * 100));
  const d7 = a7 && a7p ? a7 - a7p : null;
  h += `<div class="stats"><div><small>Priemer 7 dní</small><b>${a7?fmt(a7,1):'–'}</b></div><div><small>Za týždeň</small><b style="color:${d7==null?'inherit':d7>0.5?'var(--warn)':d7>=0.25?'var(--ok)':'var(--c)'}">${d7==null?'–':(d7>0?'+':'')+fmt(d7,2)}</b></div><div><small>Do cieľa</small><b>${fmt(Math.abs(G.target-now),1)} kg</b></div></div>`;
  h += `<div class="card"><div class="row" style="justify-content:space-between"><span class="small muted" style="flex:none">${fmt(G.start,0)} kg</span><b class="small" style="flex:none">${fmt(prog)} %</b><span class="small muted" style="flex:none">${fmt(G.target,0)} kg</span></div><div class="bar" style="margin-top:8px;height:11px"><i style="width:${prog}%"></i></div></div>`;
  const gl = (S.prof && S.prof.goal) || (G.target < G.start ? 'cut' : 'gain');
  if (a7 && a14 && gl !== 'gain'){
    const two = a7 - a14, lim = gl === 'cut' ? -0.5 : -0.3;
    let adv = 'Ideš dobrým tempom, nič nemeň.';
    if (two > lim) adv = 'Za 2 týždne si schudol menej, než by si mal. Uber 150–200 kcal denne.';
    else if (d7 != null && d7 < (gl === 'cut' ? -1 : -0.6)) adv = 'Chudneš príliš rýchlo, mohol by si prichádzať o svaly. Pridaj 150 kcal denne.';
    h += `<div class="note"><b>Odporúčanie:</b> ${adv}</div>`;
  } else if (a7 && a14){
    const two = a7 - a14;
    let adv = 'Ideš dobrým tempom, nič nemeň.';
    if (two < 0.5) adv = 'Za 2 týždne si pribral menej než 0,5 kg. Pridaj 150–200 kcal denne (napr. banán a hrsť orechov).';
    else if (d7 != null && d7 > 0.5) adv = 'Priberáš viac než 0,5 kg týždenne. Uber 150 kcal denne, nech priberáš hlavne svaly.';
    h += `<div class="note"><b>Odporúčanie:</b> ${adv}</div>`;
  } else h += '<div class="note">Po 2 týždňoch váženia ti tu ukážem, či máš pridať alebo ubrať kalórie.</div>';
  h += '<h3>Graf váhy</h3><div class="card chart">' + chart() + '</div>';
  const ks = Object.keys(S.weight).sort().reverse().slice(0, 10);
  if (ks.length) h += '<h3>Záznamy</h3><div class="card list">' + ks.map(k => `<div class="it"><div class="tx"><b>${fmt(S.weight[k],1)} kg</b><small>${DNI[parseKey(k).getDay()]} ${kShort(k)}</small></div><button class="x" data-act="delweight" data-k="${k}" aria-label="Zmazať">${ICON.x}</button></div>`).join('') + '</div>';

}
function chart(){
  const ks = Object.keys(S.weight).sort().slice(-60);

  const t0 = parseKey(ks[0]).getTime(), t1 = Math.max(parseKey(ks[ks.length-1]).getTime(), t0 + 864e5);
  const x = k => P + (parseKey(k).getTime() - t0) / (t1 - t0) * (W - P - 10);
  const y = v => 10 + (hi - v) / (hi - lo) * (H - 40);
  const pts = ks.map(k => `${x(k).toFixed(1)},${y(S.weight[k]).toFixed(1)}`).join(' ');
  let g = '';
  for (let v = lo; v <= hi; v += Math.max(1, Math.round((hi - lo) / 4))) g += `<line x1="${P}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#272D3F"/><text x="${P-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#9AA3B2">${v}</text>`;
  g += `<line x1="${P}" x2="${W-10}" y1="${y(S.goals.target)}" y2="${y(S.goals.target)}" stroke="#34D399" stroke-dasharray="5 5"/><text x="${W-12}" y="${y(S.goals.target)-6}" text-anchor="end" font-size="12" fill="#34D399">cieľ ${S.goals.target} kg</text>`;
  g += `<text x="${P}" y="${H-6}" font-size="12" fill="#9AA3B2">${kShort(ks[0])}</text><text x="${W-10}" y="${H-6}" text-anchor="end" font-size="12" fill="#9AA3B2">${kShort(ks[ks.length-1])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf váhy">${g}<polyline points="${pts}" fill="none" stroke="url(#gr)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${ks.map(k => `<circle cx="${x(k)}" cy="${y(S.weight[k])}" r="3.5" fill="#22D3EE"/>`).join('')}</svg>`;
}

/* ---------- Kalkulačka cieľa ---------- */
const GOALS = {gain:['Nabrať svaly',300,0.35], rys:['Rysovať postavu',-300,-0.3], cut:['Schudnúť',-500,-0.5]};
const ACT = [['Sedavá práca, cvičím 3–4× týždenne',1.45],['Sedavá práca, cvičím 5× týždenne a viac',1.55],['Práca v pohybe, cvičím 3–5× týždenne',1.65],['Fyzicky náročná práca a k tomu cvičím',1.8]];
function calcHtml(){
  const lw = curWeight(todayKey() > cur ? todayKey() : cur);
  const P = S.prof ? Object.assign({}, S.prof, {w:lw}) : {goal:'gain', sex:'m', age:'', h:'', w:lw, tw:S.goals.target, act:1};
  const o = (v, l, c) => `<option value="${v}" ${String(c)===String(v)?'selected':''}>${l}</option>`;
  const f = (id, l, v, ph) => `<label class="fld"><span>${l}</span><input id="pc_${id}" inputmode="decimal" value="${esc(v ?? '')}" placeholder="${ph||''}"></label>`;
  return `<div class="chips" style="margin:0 0 8px;padding:0;overflow:visible;flex-wrap:wrap">${Object.entries(GOALS).map(([k,g]) => `<button class="chip ${P.goal===k?'on':''}" data-act="pgoal" data-g="${k}">${g[0]}</button>`).join('')}</div>
  <div class="g2"><label class="fld"><span>Pohlavie</span><select id="pc_sex">${o('m','Muž',P.sex)}${o('f','Žena',P.sex)}</select></label>${f('age','Vek',P.age,'napr. 25')}${f('h','Výška (cm)',P.h,'napr. 180')}${f('w','Aktuálna váha (kg)',P.w)}${f('tw','Cieľová váha (kg)',P.tw)}</div>
  <label class="fld"><span>Aktivita</span><select id="pc_act">${ACT.map((a,i) => o(i, a[0], P.act)).join('')}</select></label>
  <div id="pc_res"></div>`;
}
function calcVals(){
  const g = document.querySelector('[data-act="pgoal"].on'); 
  const P = {goal:g ? g.dataset.g : 'gain', sex:$('#pc_sex').value, age:num($('#pc_age').value), h:num($('#pc_h').value), w:num($('#pc_w').value), tw:num($('#pc_tw').value), act:+$('#pc_act').value};
  return calcFrom(P);
}
function calcFrom(P){
  if (!(P.age > 10 && P.h > 120 && P.w > 30)) return {P};
  const bmr = 10*P.w + 6.25*P.h - 5*P.age + (P.sex === 'f' ? -161 : 5);
  const tdee = bmr * ACT[P.act][1];
  const G = GOALS[P.goal];
  const kcal = Math.round((tdee + G[1]) / 50) * 50;
  const p = Math.round(P.w * (P.goal === 'gain' ? 2 : 2.2));
  const f = Math.round(Math.max(P.w * 0.9, kcal * 0.25 / 9));
  const c = Math.max(50, Math.round((kcal - p*4 - f*9) / 4));
  const weeks = P.tw && Math.sign(P.tw - P.w) === Math.sign(G[2]) ? Math.ceil(Math.abs(P.tw - P.w) / Math.abs(G[2])) : null;
  return {P, tdee:Math.round(tdee/50)*50, kcal, p, f, c, water:Math.round(P.w*35/250)*250, weeks};
}
function applyGoals(r, setStart){ Object.assign(S.goals, {kcal:r.kcal, kcalRun:r.kcal + 200, p:r.p, f:r.f, c:r.c, water:r.water, target:r.P.tw || r.P.w}); if (setStart) S.goals.start = r.P.w; }
function calcRender(){
  const el = $('#pc_res'); if (!el) return; const r = calcVals();

  el.innerHTML = `<div class="card" style="background:var(--card2)"><div class="row" style="align-items:flex-end;justify-content:space-between"><div style="flex:none"><div class="big grad">${fmt(r.kcal)}</div><span class="muted small">kcal denne</span></div><div style="flex:none;text-align:right" class="muted small">Udržanie váhy: ${fmt(r.tdee)} kcal<br>${GOALS[r.P.goal][1] > 0 ? '+' : ''}${GOALS[r.P.goal][1]} kcal pre cieľ</div></div>
  <div class="macros"><div><b>${r.p} g</b>Bielkoviny</div><div><b>${r.f} g</b>Tuky</div><div><b>${r.c} g</b>Sacharidy</div></div>
  <p class="muted small" style="margin:12px 0 0;line-height:1.5">${wrong ? 'Cieľová váha nesedí s vybraným cieľom, skontroluj ju.' : r.weeks ? `Tempo okolo ${fmt(Math.abs(GOALS[r.P.goal][2]),2)} kg týždenne, cieľ zhruba o <b style="color:var(--t)">${r.weeks} týždňov</b>.` : ''} Voda ${fmt(r.water/1000,2)} l. V deň behu +200 kcal.</p></div>
  <button class="btn" data-act="papply">Použiť tieto ciele</button>`;
}

/* ---------- Časovač ---------- */
let tEnd = 0, tInt = 0, actx = null;
function tone(f, at, len, vol){ const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = f; o.connect(g); g.connect(actx.destination); const t = actx.currentTime + at; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.setValueAtTime(vol, t + len - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + len); o.start(t); o.stop(t + len + 0.02); }
function beep(){ try { if (!actx) return; actx.resume && actx.resume(); [0, 0.35, 0.7].forEach((at, i) => tone(i === 2 ? 1320 : 990, at, i === 2 ? 0.6 : 0.25, 0.5)); } catch(e){} }
function pip(){ try { if (!actx) return; actx.resume && actx.resume(); tone(660, 0, 0.12, 0.35); } catch(e){} }
let lastPip = 0;
let tLbl = 'Pauza';
function startTimer(sec, lbl){
  tLbl = lbl || 'Pauza';
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); } catch(e){}
  lastPip = 0;
  tEnd = Date.now() + sec * 1000; $('#timer').classList.add('show'); $('#timer').classList.remove('end'); tick();
  clearInterval(tInt); tInt = setInterval(tick, 250);
}
function tick(){
  const left = Math.ceil((tEnd - Date.now()) / 1000);
  if (left <= 0){
    $('#tval').textContent = '0:00'; $('#tlbl').textContent = 'Pauza skončila, ďalšia séria';
    $('#timer').classList.add('end'); clearInterval(tInt); beep(); try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
    setTimeout(() => { if (Date.now() > tEnd + 9000) $('#timer').classList.remove('show'); }, 10000);
    return;
  }
  if (left <= 3 && left !== lastPip){ lastPip = left; pip(); }
  $('#tlbl').textContent = tLbl; $('#tval').textContent = Math.floor(left/60) + ':' + pad(left % 60);
}

/* ---------- Render ---------- */
function render(){
  const d = parseKey(cur), isT = cur === todayKey();
  $('#dlbl').innerHTML = `${DNI[d.getDay()]} ${kShort(cur)}${isT || cur === firstDay() ? '' : '<button class="today" data-act="today">'+(todayKey() < START ? 'Štart' : 'Dnes')+'</button>'}<small>${cur === START && !isT && todayKey() < START ? 'štart plánu' : isT ? 'dnes' : cur < todayKey() ? 'minulý deň' : 'budúci deň'}</small>`;
  document.querySelector('[data-act="day"][data-d="-1"]').style.visibility = cur <= minDay() ? 'hidden' : '';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const m = $('#main');
  spyF = ''; m.innerHTML = tab === 'plan' ? renderPlan() : tab === 'strava' ? renderStrava() : tab === 'doplnky' ? renderDoplnky() : tab === 'pokrok' ? renderPokrok() : renderTrening();
  if (tab === 'plan') setTimeout(() => window.dispatchEvent(new Event('scroll')), 0);
}
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ---------- Udalosti ---------- */
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb){ tab = tb.dataset.tab; try { localStorage.setItem(KEY + '-tab', tab); } catch(err){} render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'day'){ const n = addDays(cur, +b.dataset.d); if (n < minDay()) return; cur = n; render(); window.scrollTo(0, 0); }
  else if (a === 'today'){ cur = firstDay(); render(); window.scrollTo(0, 0); }
  else if (a === 'goto'){ cur = b.dataset.k; render(); window.scrollTo(0, 0); }
  else if (a === 'pickw'){ const l = logFor(cur, true); l.w = b.dataset.w; save(); rerender(); }
  else if (a === 'set'){
    const l = logFor(cur, true); l.d = l.d || {}; const id = b.dataset.id, cnt = +b.dataset.cnt;
    const n = Math.min(cnt, (l.d[id] || 0) + 1); l.d[id] = n; save(); rerender();
    if (n < cnt){ startTimer(+b.dataset.rest, 'Séria ' + n + ' z ' + cnt + ' hotová · pauza'); toast('Séria ' + n + ' z ' + cnt + ' hotová'); }
    else { startTimer(b.dataset.core ? 60 : 120, 'Cvik splnený · pauza pred ďalším'); toast('Cvik splnený!'); }
  }
  else if (a === 'unset'){ const l = logFor(cur, true); l.d = l.d || {}; const id = b.dataset.id; l.d[id] = Math.max(0, (l.d[id] || 0) - 1); save(); rerender(); }
  else if (a === 'ok'){
    const l = logFor(cur, true); const id = b.dataset.id, i = +b.dataset.i;
    l.s[id] = l.s[id] || []; const s = l.s[id][i] = l.s[id][i] || {};
    s.ok = !s.ok; save(); rerender();
  }
  else if (a === 'done'){ const l = logFor(cur, true); l.done = !l.done; save(); rerender(); if (l.done) toast('Super, tréning zapísaný'); }
  else if (a === 'tadd'){ tEnd += +b.dataset.s * 1000; if (tEnd > Date.now()){ $('#timer').classList.remove('end'); clearInterval(tInt); tInt = setInterval(tick, 250); } tick(); }
  else if (a === 'tstop'){ clearInterval(tInt); $('#timer').classList.remove('show'); }
  else if (a === 'water'){ S.water[cur] = Math.max(0, (S.water[cur] || 0) + +b.dataset.ml); save(); rerender(); }
  else if (a === 'delfood'){ (S.food[cur] || []).splice(+b.dataset.i, 1); save(); rerender(); }
  else if (a === 'addsaved'){
    const f = S.foods.find(x => x.id === b.dataset.id); if (!f) return;
    const fp = foodPer(f); if (fp){ openGrams(Object.assign({id:f.id}, fp)); return; }
    const p = 1;
    (S.food[cur] = S.food[cur] || []).push({n: (p !== 1 ? fmt(p,1) + '× ' : '') + f.n, kcal:Math.round(f.kcal*p), p:Math.round(f.p*p), f:Math.round(f.f*p), c:Math.round(f.c*p), v:Math.round((f.v||0)*p)});
    save(); rerender(); toast('Pridané: ' + f.n);
  }
  else if (a === 'editfoods'){ editFoods = !editFoods; rerender(); }
  else if (a === 'delsaved'){ S.foods = S.foods.filter(x => x.id !== b.dataset.id); save(); rerender(); }
  else if (a === 'addnew'){
    const n = $('#nn').value.trim(); const k = num($('#nk').value);
    if (n && !k){ const d = DB.find(x => norm(x[0]) === norm(n)) || DB.find(x => norm(x[0]).startsWith(norm(n))); if (d){ openGrams({base:d[0], per:{kcal:d[1], p:d[2], f:d[3], c:d[4], v:d[5]}, g:num($('#ng').value) || d[6] || '', u:d[0].startsWith('Mlieko') ? 'ml' : 'g'}); return; } }
    if (!n || !k){ toast('Zadaj aspoň názov a kcal'); return; }
    const item = {n, kcal:Math.round(k), p:Math.round(num($('#np').value)), f:Math.round(num($('#nf').value)), c:Math.round(num($('#nc').value)), v:Math.round(num($('#nv').value))};
    const ng = num($('#ng').value), k1 = ng ? 100 / ng : 0, r1 = x => Math.round(x * k1 * 10) / 10;
    (S.food[cur] = S.food[cur] || []).push(ng ? Object.assign({}, item, {n:n + ' ' + fmt(ng) + ' g'}) : item);
    if (ng) Object.assign(item, {base:n, g:ng, u:'g', n:n + ' ' + fmt(ng) + ' g', per:{kcal:r1(item.kcal), p:r1(num($('#np').value)), f:r1(num($('#nf').value)), c:r1(num($('#nc').value)), v:r1(num($('#nv').value))}});
    if ($('#nsave').checked && !S.foods.some(x => x.n.toLowerCase() === n.toLowerCase())) S.foods.unshift(Object.assign({id:'u' + Date.now()}, item));
    save(); rerender(); toast('Jedlo pridané');
  }
  else if (a === 'adddb'){ const d = DB[+b.dataset.i]; if (d) openGrams({base:d[0], per:{kcal:d[1], p:d[2], f:d[3], c:d[4], v:d[5]}, g:d[6] || '', u:d[0].startsWith('Mlieko') ? 'ml' : 'g'}); }
  else if (a === 'gq'){ $('#r_g').value = b.dataset.g; scanSum(); }
  else if (a === 'addgrams') addGrams();
  else if (a === 'howto') openHow(exName(b.dataset.w, b.dataset.id));
  else if (a === 'col'){ S.col = S.col || {}; const k = b.dataset.k; if (S.col[k]) delete S.col[k]; else S.col[k] = 1; save(); rerender(); }
  else if (a === 'supp'){ const t = S.suppLog[cur] = S.suppLog[cur] || []; const i = t.indexOf(b.dataset.id); if (i < 0){ t.push(b.dataset.id); try { navigator.vibrate && navigator.vibrate(30); } catch(e){} } else t.splice(i, 1); save(); rerender(); }
  else if (a === 'daytype'){ S.dayType = S.dayType || {}; const auto = workoutFor(cur) ? 't' : 'r'; if (b.dataset.t === auto) delete S.dayType[cur]; else S.dayType[cur] = b.dataset.t; save(); rerender(); }
  else if (a === 'editsupp'){ suppEdit = b.dataset.id; rerender(); const f = $('#sn'); if (f){ f.scrollIntoView({behavior:'smooth', block:'center'}); } }
  else if (a === 'canceledit'){ suppEdit = null; rerender(); }
  else if (a === 'delsupp'){ const x = S.supps.find(y => y.id === b.dataset.id), t = dayType(cur); if (x && confirm('Odstrániť ' + x.n + ' z tohto typu dňa?')){ x[{t:'doseT',f:'doseF',r:'doseR'}[t]] = ''; if (!['t','f','r'].some(k => doseOf(x, k))) S.supps = S.supps.filter(y => y !== x); suppEdit = null; save(); rerender(); } }
  else if (a === 'addsupp'){
    const t = dayType(cur), n = $('#sn').value.trim(), d = $('#sd_' + t).value.trim(), w = $('#sw_' + t).value, tm = (m => m ? m[1] + (m[2] ? '–' + m[2] : '') : '')($('#st_' + t).value.match(/(\d+)(?:\s*[-–—]\s*(\d+))?/)), note = $('#snote').value.trim();
    if (!n){ toast('Zadaj názov doplnku'); return; }
    if (!d){ toast('Zadaj množstvo'); return; }
    const E = suppEdit && S.supps.find(x => x.id === suppEdit);
    const dk = {t:'doseT', f:'doseF', r:'doseR'}[t];
    if (E){ ['t','f','r'].forEach(k => { E[{t:'doseT',f:'doseF',r:'doseR'}[k]] = doseOf(E, k); E[WK[k]] = whenOf(E, k); }); delete E.when; delete E.dose; E.n = n; E.note = note; E[dk] = d; E[WK[t]] = w; E[TK[t]] = tm; }
    else { const o = {id:'s' + Date.now(), n, note, doseT:'', doseF:'', doseR:'', wT:'', wF:'', wR:''}; o[dk] = d; o[WK[t]] = w; o[TK[t]] = tm; S.supps.push(o); }
    toast(E ? 'Uložené' : 'Doplnok pridaný'); suppEdit = null; save(); rerender();
  }
  else if (a === 'saveweight'){ const v = num($('#wkg').value); if (v < 30 || v > 250){ toast('Zadaj váhu v kg'); return; } S.weight[cur] = Math.round(v*10)/10;
    let msg = 'Váha uložená';
    if (S.prof){ const P = Object.assign({}, S.prof, {w:curWeight(todayKey() > cur ? todayKey() : cur)}); const r = calcFrom(P); if (r.kcal){ const old = S.goals.kcal; S.prof = P; applyGoals(r, false); if (r.kcal !== old) msg = 'Váha uložená, nový cieľ ' + fmt(r.kcal) + ' kcal'; } }
    save(); rerender(); toast(msg); }
  else if (a === 'delweight'){ delete S.weight[b.dataset.k]; save(); rerender(); }
  else if (a === 'jump'){ const el = document.getElementById('p-' + b.dataset.f); if (el) el.scrollIntoView({behavior:'smooth'}); setActiveChip(b.dataset.f); }
  else if (a === 'settings') openSettings();
  else if (a === 'close') closeModal();
  else if (a === 'scan') openScan();
  else if (a === 'pgoal'){ document.querySelectorAll('[data-act="pgoal"]').forEach(x => x.classList.toggle('on', x === b)); calcRender(); }
  else if (a === 'papply'){
    const r = calcVals(); if (!r.kcal) return;
    S.prof = r.P; applyGoals(r, true);
    save(); closeModal(); rerender(); toast('Ciele nastavené: ' + fmt(r.kcal) + ' kcal');
  }
  else if (a === 'ghjoin'){
    const t = ($('#ghtoken').value || '').trim(); if (t.length < 20){ toast('Vlož celý kľúč'); return; }
    b.disabled = true; b.textContent = 'Pripájam…';
    connectGH(t).then(r => { $('#syncbox').innerHTML = syncHtml(); toast(r === 'pulled' ? 'Údaje načítané' : 'Synchronizácia zapnutá'); })
      .catch(err => { SY = {}; saveSY(); toast(typeof err === 'string' ? err : 'Bez pripojenia'); b.disabled = false; b.textContent = 'Pripojiť'; });
  }
  else if (a === 'syncnow'){ pullNow().then(r => { $('#syncbox').innerHTML = syncHtml(); toast(r ? 'Synchronizované' : (SY.err || 'Bez pripojenia')); }); }
  else if (a === 'syncoff'){ if (confirm('Vypnúť synchronizáciu na tomto zariadení? Údaje tu aj na GitHube zostanú.')){ SY = {}; saveSY(); $('#syncbox').innerHTML = syncHtml(); } }
  else if (a === 'addact'){
    const i = +$('#asp').value, min = num($('#amin').value); if (!min || min > 600){ toast('Zadaj, koľko minút'); return; }
    const sp = SPORTS[i]; const kcal = Math.round((sp[1] - 1) * curWeight(cur) * min / 60 / 10) * 10;
    S.act = S.act || {}; (S.act[cur] = S.act[cur] || []).push({s:sp[0], min, kcal}); sportSel = i; save(); rerender(); toast('+' + kcal + ' kcal k dnešnému cieľu');
  }
  else if (a === 'delact'){ (S.act[cur] || []).splice(+b.dataset.i, 1); save(); rerender(); }
  else if (a === 'lookup'){ const c = ($('#scode').value || '').replace(/\D/g, ''); if (c.length < 6){ toast('Zadaj celý čiarový kód'); return; } stopCam(); lookup(c); }
  else if (a === 'rescan'){ $('#sres').innerHTML = ''; $('#scode').value = ''; const vd = document.querySelector('.vid'); if (vd) vd.style.display = ''; startCam(); }
  else if (a === 'addscan') addScanned();
  else if (a === 'savegoals'){ ['kcal','kcalRun','p','f','c','water','start','target'].forEach(k => { const v = num($('#g_' + k).value); if (v > 0) S.goals[k] = v; }); save(); closeModal(); rerender(); toast('Ciele uložené'); }
  else if (a === 'export'){
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
    const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'fitio-zaloha-' + todayKey() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  }
  else if (a === 'reset'){ if (confirm('Naozaj vymazať všetky tréningy, jedlá, doplnky a váhu?')){ S = fresh(); save(); closeModal(); rerender(); toast('Vymazané'); } }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id && t.id.startsWith('r_')){ scanSum(); return; }
  if (t.id && t.id.startsWith('pc_')){ calcRender(); return; }
  if (t.dataset.t){ S.cur = S.cur || {}; S.cur[t.dataset.t] = t.value.trim(); save(); }
  else if (t.dataset.run){ const l = logFor(cur, true); l.run = l.run || {}; l.run[t.dataset.run] = t.value.trim(); save(); }
  else if (t.id === 'fq'){ foodQ = t.value; const y = window.scrollY; render(); const f = $('#fq'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); window.scrollTo(0, y); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sphoto' && e.target.files[0]){ stopCam(); scanPhoto(e.target.files[0]); e.target.value = ''; return; }
  if (e.target.id === 'pc_sex' || e.target.id === 'pc_act'){ calcRender(); return; }
  if (e.target.dataset.tg){ S.tgt = S.tgt || {}; const v = e.target.value.trim(); if (v) S.tgt[e.target.dataset.tg] = v; else delete S.tgt[e.target.dataset.tg]; save(); rerender(); toast('Uložené'); return; }
  if (e.target.id === 'portion') portion = num(e.target.value) || 1;
  if (e.target.id === 'imp' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.goals) throw 0; S = Object.assign(fresh(), d); save(); closeModal(); rerender(); toast('Záloha obnovená'); } catch(err){ toast('Toto nie je platná záloha'); } };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input.tgi, input.fx')) e.target.blur(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden){ if (tEnd) tick(); pullNow(); } else if (SY.gist && dirty){ clearTimeout(pushT); pushNow(); } });

render(); setHH(); pullNow();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
